# fly.toml - wird von "flyctl launch" automatisch angepasst
app = "mein-chat"
primary_region = "fra"

[build]

[env]
  PORT = "3000"
  DATA_DIR = "/data"

[mounts]
  source = "chat_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
